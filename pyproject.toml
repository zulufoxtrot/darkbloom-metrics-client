[project]
name = "darkbloom-metrics-client"
version = "1.0.0"
description = "Scrapes the darkbloom network console API and pushes metrics to InfluxDB (Home Assistant-compatible schema)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "influxdb-client>=1.44",
]

[project.scripts]
darkbloom-metrics-client = "darkbloom_metrics.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darkbloom_metrics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
